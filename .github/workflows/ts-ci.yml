name: TypeScript CI

on:
  push:
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/ts-ci.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/ts-ci.yml'

jobs:
  type-check-and-build:
    name: Type-check & build (TypeScript / Next.js)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Next.js build (lint + compile)
        env:
          # Dummy values so Next.js doesn't error on missing env at build time.
          PYTHON_BACKEND_URL: 'http://localhost:8000'
          DATABASE_URL: 'placeholder-not-a-real-db-url'
        run: npm run build
